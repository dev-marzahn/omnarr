# omnarr, the VPN layout: merged over compose.yml. Needs Docker
# Compose 2.24 or later (`!reset`) and /dev/net/tun on the host. Turn it on in .env:
#
#   COMPOSE_FILE=compose.yml:compose.vpn.yml
#
# then run `docker compose up -d`. compose.vpn.merged.yml is the two files in
# one, for a front end that ignores COMPOSE_FILE; regenerate it after an edit
# here (node scripts/merge-vpn-compose.ts). Gluetun carries qBittorrent's traffic, and
# qBittorrent publishes no port. To recreate gluetun, recreate qBittorrent with
# it, or qBittorrent keeps a dead network:
#
#   docker compose up -d --force-recreate gluetun qbittorrent
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    entrypoint:
      - /bin/sh
      - -c
      - |
        read_settings() { settings=$$(cat /vpn/gluetun.env 2>/dev/null); }
        start_gluetun() {
          read_settings
          started=$$settings
          exited_at=
          (
            while IFS= read -r line; do
              case "$$line" in '' | '#'*) ;; *) export "$$line" ;; esac
            done <<SETTINGS
        $$started
        SETTINGS
            exec /gluetun-entrypoint
          ) &
          gluetun=$$!
        }
        stop_gluetun() { kill -TERM "$$gluetun" 2>/dev/null; wait "$$gluetun"; }
        trap 'stop_gluetun; exit 0' TERM INT
        start_gluetun
        while :; do
          sleep 5 &
          wait $$!
          read_settings
          if kill -0 "$$gluetun" 2>/dev/null; then
            [ "$$settings" = "$$started" ] || { stop_gluetun; start_gluetun; }
          else
            exited_at=$${exited_at:-$$(date +%s)}
            if [ "$$settings" != "$$started" ] || [ $$(($$(date +%s) - exited_at)) -ge 60 ]; then start_gluetun; fi
          fi
        done
    environment:
      # The health server, which alone shows a dead WireGuard tunnel.
      HEALTH_SERVER_ADDRESS: ':9999'
      FIREWALL_INPUT_PORTS: '8000,8080,9999'
      # Refreshes the providers' server lists daily into gluetun-data.
      UPDATER_PERIOD: 24h
    volumes:
      - ./vpn:/vpn:ro
      # Keeps a forwarded port (PIA, for 60 days) and the server list across recreates.
      - gluetun-data:/gluetun
      # setup-clients' auth file: one read-only role with the generated key.
      - gluetun-auth:/gluetun/auth:ro
    depends_on:
      setup: { condition: service_completed_successfully }

  qbittorrent:
    network_mode: service:gluetun
    networks: !reset null
    ports: !reset []
    # `restart: true`: a Compose operation that restarts or recreates gluetun restarts qBittorrent
    # into gluetun's new network namespace too.
    depends_on:
      gluetun: { condition: service_started, restart: true }

  worker:
    environment:
      QBITTORRENT_URL: http://gluetun:8080
      GLUETUN_URL: http://gluetun:8000
