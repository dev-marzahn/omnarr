# omnarr, the VPN layout in one file: compose.yml with compose.vpn.yml merged
# over it, for a front end that deploys one compose file, such as Coolify.
# Generated by `node scripts/merge-vpn-compose.ts`; edit those two files instead.
# Needs Docker Compose 2.24 or later and /dev/net/tun on the host. Gluetun
# carries qBittorrent's traffic, and qBittorrent publishes no port. To recreate
# gluetun, recreate qBittorrent with it, or qBittorrent keeps a dead network.

# These pins are the release's manifest: every image by tag and digest.

name: omnarr

services:
  # The one-shot setup container: secrets, the setup password, the /data tree and ./definitions, the
  # clients' control keys and the owners. It runs, as root, before everything else on every `up`.
  setup:
    image: ghcr.io/dev-marzahn/omnarr-worker:100.0.2@sha256:a96b6275db68b7a9736658e7cd675f217cbc3ba7a37d02e23bd74f76ac11cadf
    command: ['setup']
    user: '0:0'
    restart: 'no'
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Only whether it is set is used: without it, setup generates one.
      OMNARR_SETUP_PASSWORD: ${OMNARR_SETUP_PASSWORD:-}
      OMNARR_SECRETS_DIR: /run/omnarr/secrets
      NZBGET_CONFIG: /nzbget-config/nzbget.conf
      QBITTORRENT_CONFIG: /qbittorrent-config/qBittorrent/config/qBittorrent.conf
      GLUETUN_AUTH: /gluetun-auth/config.toml
    volumes:
      - backend-secrets:/run/omnarr/backend-secrets
      - secrets:/run/omnarr/secrets
      - nzbget-config:/nzbget-config
      - qbittorrent-config:/qbittorrent-config
      - gluetun-auth:/gluetun-auth
      - jellyfin-config:/jellyfin-config
      - jellyfin-cache:/jellyfin-cache
      - type: bind
        source: ${OMNARR_DATA_DIR:-./data}
        target: /data
        bind: {create_host_path: true}
      - ./vpn:/vpn
      - ./backups:/backups
      # Docker creates it as root's; setup gives it PUID:PGID, so the user can add files.
      - ./definitions:/definitions

  # The Convex backend with the platform's functions (convex-release's combined image). On every
  # start it sets the deployment variables (pre-push hook), applies the release, runs the reference
  # seeds (post-apply hook), and only then reports healthy. The admin key never leaves it.
  backend:
    image: ghcr.io/dev-marzahn/omnarr-backend:100.0.2@sha256:d61f12c3403bc35b96c89f61260fc2340dcf41c0398a0c374b20fb2a0978c168
    restart: unless-stopped
    environment:
      INSTANCE_NAME: omnarr
      DISABLE_BEACON: '1'
      # Where browsers reach the backend; storage URLs start with the first.
      CONVEX_CLOUD_ORIGIN: ${OMNARR_CONVEX_URL:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${OMNARR_CONVEX_SITE_URL:-http://127.0.0.1:3211}
      # Convex's limit for a query or mutation is 1 s; a NAS or a busy host needs more.
      DATABASE_UDF_USER_TIMEOUT_SECONDS: '5'
      # Restore and downgrade only (docs/install.md).
      CONVEX_RELEASE_SNAPSHOT: ${CONVEX_RELEASE_SNAPSHOT:-}
      # An export to ./backups before each upgrade that migrates, the newest 3 kept.
      CONVEX_RELEASE_BACKUP_DIR: /backups
      # What the pre-push hook reads: a change here recreates the backend on `docker compose up -d`.
      OMNARR_WEB_URL: ${OMNARR_WEB_URL:-}
      OMNARR_CONVEX_URL: ${OMNARR_CONVEX_URL:-}
      OMNARR_CONVEX_SITE_URL: ${OMNARR_CONVEX_SITE_URL:-}
      OMNARR_JELLYFIN_URL: ${OMNARR_JELLYFIN_URL:-}
      OMNARR_WEB_PORT: ${OMNARR_WEB_PORT:-3000}
      OMNARR_CONVEX_PORT: ${OMNARR_CONVEX_PORT:-3210}
      OMNARR_CONVEX_SITE_PORT: ${OMNARR_CONVEX_SITE_PORT:-3211}
      OMNARR_JELLYFIN_PORT: ${OMNARR_JELLYFIN_PORT:-8096}
      OMNARR_SETUP_PASSWORD: ${OMNARR_SETUP_PASSWORD:-}
      OMNARR_UPDATE_CHECK: ${OMNARR_UPDATE_CHECK:-on}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    volumes:
      - convex-data:/convex/data
      - backend-secrets:/run/omnarr/backend-secrets:ro
      - ./backups:/backups
    ports:
      - ${OMNARR_BIND_ADDRESS:-0.0.0.0}:${OMNARR_CONVEX_PORT:-3210}:3210
      - ${OMNARR_BIND_ADDRESS:-0.0.0.0}:${OMNARR_CONVEX_SITE_PORT:-3211}:3211
    depends_on:
      setup: {condition: service_completed_successfully}

  worker:
    image: ghcr.io/dev-marzahn/omnarr-worker:100.0.2@sha256:a96b6275db68b7a9736658e7cd675f217cbc3ba7a37d02e23bd74f76ac11cadf
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      CONVEX_URL: http://backend:3210
      WORKER_TOKEN_FILE: /run/omnarr/secrets/worker_token
      JELLYFIN_URL: http://jellyfin:8096
      QBITTORRENT_URL: http://gluetun:8080
      QBITTORRENT_PEER_PORT: ${OMNARR_PEER_PORT:-6881}
      # Where the worker downloads Prowlarr's site definitions; your own go in ./definitions.
      OMNARR_DEFINITIONS_URL: ${OMNARR_DEFINITIONS_URL:-https://indexers.prowlarr.com/master}
      GLUETUN_URL: http://gluetun:8000
    volumes:
      - type: bind
        source: ${OMNARR_DATA_DIR:-./data}
        target: /data
        bind: {create_host_path: true}
      - secrets:/run/omnarr/secrets:ro
      - ./vpn:/vpn
      - ./definitions:/definitions:ro
    depends_on:
      backend: {condition: service_healthy}

  # The web app: it reads the URLs from its environment when it starts. Unset, the browser
  # builds each from its own address and the port.
  web:
    image: ghcr.io/dev-marzahn/omnarr-web:100.0.2@sha256:c80c90e80ebf890ed004c356cc3c2617b6fe95cb29c490e7df38b8a121b408ed
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_WEB_URL: ${OMNARR_WEB_URL:-}
      NUXT_PUBLIC_CONVEX_URL: ${OMNARR_CONVEX_URL:-}
      NUXT_PUBLIC_CONVEX_SITE_URL: ${OMNARR_CONVEX_SITE_URL:-}
      NUXT_PUBLIC_JELLYFIN_PUBLIC_URL: ${OMNARR_JELLYFIN_URL:-}
      NUXT_PUBLIC_WEB_PORT: ${OMNARR_WEB_PORT:-3000}
      NUXT_PUBLIC_CONVEX_PORT: ${OMNARR_CONVEX_PORT:-3210}
      NUXT_PUBLIC_CONVEX_SITE_PORT: ${OMNARR_CONVEX_SITE_PORT:-3211}
      NUXT_PUBLIC_JELLYFIN_PORT: ${OMNARR_JELLYFIN_PORT:-8096}
    ports:
      - ${OMNARR_BIND_ADDRESS:-0.0.0.0}:${OMNARR_WEB_PORT:-3000}:3000
    depends_on:
      backend: {condition: service_healthy}

  # The download clients keep their control ports on the internal network (scripts/check-ports.ts).
  nzbget:
    image: nzbgetcom/nzbget:v26.3@sha256:f451d98066cbc0c108146420a61a60f7638de50e067738951461e0105eeaa56d
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - nzbget-config:/config
      - type: bind
        source: ${OMNARR_DATA_DIR:-./data}
        target: /data
        bind: {create_host_path: true}
    depends_on:
      setup: {condition: service_completed_successfully}

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    restart: unless-stopped
    environment:
      QBT_LEGAL_NOTICE: confirm
      QBT_WEBUI_PORT: '8080'
      QBT_TORRENTING_PORT: ${OMNARR_PEER_PORT:-6881}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - qbittorrent-config:/config
      - type: bind
        source: ${OMNARR_DATA_DIR:-./data}
        target: /data
        bind: {create_host_path: true}
    # Lets qBittorrent write its resume data for every seeding torrent.
    stop_grace_period: 30m
    depends_on:
      setup: {condition: service_completed_successfully}
      gluetun: {condition: service_started, restart: true}
    network_mode: service:gluetun

  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: ${OMNARR_DATA_DIR:-./data}
        target: /data
        read_only: true
        bind: {create_host_path: true}
    ports:
      - ${OMNARR_BIND_ADDRESS:-0.0.0.0}:${OMNARR_JELLYFIN_PORT:-8096}:8096
    depends_on:
      setup: {condition: service_completed_successfully}
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    entrypoint:
      - /bin/sh
      - -c
      - |
        read_settings() { settings=$$(cat /vpn/gluetun.env 2>/dev/null); }
        start_gluetun() {
          read_settings
          started=$$settings
          exited_at=
          (
            while IFS= read -r line; do
              case "$$line" in '' | '#'*) ;; *) export "$$line" ;; esac
            done <<SETTINGS
        $$started
        SETTINGS
            exec /gluetun-entrypoint
          ) &
          gluetun=$$!
        }
        stop_gluetun() { kill -TERM "$$gluetun" 2>/dev/null; wait "$$gluetun"; }
        trap 'stop_gluetun; exit 0' TERM INT
        start_gluetun
        while :; do
          sleep 5 &
          wait $$!
          read_settings
          if kill -0 "$$gluetun" 2>/dev/null; then
            [ "$$settings" = "$$started" ] || { stop_gluetun; start_gluetun; }
          else
            exited_at=$${exited_at:-$$(date +%s)}
            if [ "$$settings" != "$$started" ] || [ $$(($$(date +%s) - exited_at)) -ge 60 ]; then start_gluetun; fi
          fi
        done
    environment:
      # The health server, which alone shows a dead WireGuard tunnel.
      HEALTH_SERVER_ADDRESS: ':9999'
      FIREWALL_INPUT_PORTS: '8000,8080,9999'
      # Refreshes the providers' server lists daily into gluetun-data.
      UPDATER_PERIOD: 24h
    volumes:
      - ./vpn:/vpn:ro
      # Keeps a forwarded port (PIA, for 60 days) and the server list across recreates.
      - gluetun-data:/gluetun
      # setup-clients' auth file: one read-only role with the generated key.
      - gluetun-auth:/gluetun/auth:ro
    depends_on:
      setup: {condition: service_completed_successfully}

volumes:
  convex-data:
  backend-secrets:
  secrets:
  nzbget-config:
  qbittorrent-config:
  gluetun-auth:
  gluetun-data:
  jellyfin-config:
  jellyfin-cache:
