# The release workflow, run by hand with a version, `0.1.0-p1`
# style for a pre-release:
#
#   1. Build   the three images for amd64 and arm64, pushed by digest only
#   2. Test    the stackUpgrade e2e from the previous GitHub release to these
#              digests; skipped when no release exists yet. A failure stops
#              the release before any tag points at the images.
#   3. Pin     tag the images, write their digests into compose.yml, write
#              compose.vpn.merged.yml, commit "Release <version>" on top of
#              the commit the release started from, and push it at once to
#              main, to the `release` branch (not for a pre-release) and as
#              the tag v<version>
#   4. Release the GitHub release with compose.yml, compose.vpn.yml,
#              compose.vpn.merged.yml and .env.example
#
# It runs only on main. The push uses the deploy key RELEASE_DEPLOY_KEY, a
# secret of the `release` environment, which only main may deploy to; main's
# ruleset lets the key past its required checks. A push with the workflow
# token wouldn't be, and would start no CI on main. `release` always holds the
# newest release's commit, for an install that follows a branch
# (docs/install.md, Coolify); a pre-release (a version with `-`) leaves it.
# Setting up the key, the environment and the rulesets: CONTRIBUTING.md, Releases.
#
# The built-in TMDB token is the repository secret TMDB_TOKEN, passed to the
# backend image as the `tmdb_token` build secret.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release version, without the v (0.1.0-p1 for a pre-release)
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/dev-marzahn
  VERSION: ${{ inputs.version }}

jobs:
  # Before any image is built: the release can push what it pins.
  preflight:
    name: On main, with the deploy key
    runs-on: ubuntu-latest
    # The environment holds the key and admits only main.
    environment: release
    steps:
      - env:
          HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "A release runs on main, not $GITHUB_REF."; exit 1; fi
          if [ "$HAS_DEPLOY_KEY" != true ]; then echo "The release environment's secret RELEASE_DEPLOY_KEY is missing (CONTRIBUTING.md, Releases)."; exit 1; fi

  build:
    name: Build ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: omnarr-backend
            dockerfile: packages/backend/Dockerfile
          - image: omnarr-worker
            dockerfile: apps/worker/Dockerfile
          - image: omnarr-web
            dockerfile: apps/web/Dockerfile
    outputs:
      omnarr-backend: ${{ steps.digest.outputs.omnarr-backend }}
      omnarr-worker: ${{ steps.digest.outputs.omnarr-worker }}
      omnarr-web: ${{ steps.digest.outputs.omnarr-web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # By digest only: no tag points at the images until step 3.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: OMNARR_VERSION=${{ env.VERSION }}
          secrets: tmdb_token=${{ secrets.TMDB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - id: digest
        run: echo "${{ matrix.image }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Step 2: the previous release's compose files and images, then these digests.
  test:
    name: Upgrade test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The newest release before this one
        id: from
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          from=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | grep -Fvx "v$VERSION" | head -n 1 | sed 's/^v//')
          echo "version=$from" >> "$GITHUB_OUTPUT"
          if [ -z "$from" ]; then echo "No release yet: the upgrade test is skipped."; fi
      - name: stackUpgrade
        if: steps.from.outputs.version != ''
        env:
          E2E_FROM_VERSION: ${{ steps.from.outputs.version }}
          E2E_TO_VERSION: ${{ env.VERSION }}
          E2E_TO_BACKEND_IMAGE: ${{ env.REGISTRY }}/omnarr-backend@${{ needs.build.outputs.omnarr-backend }}
          E2E_TO_WORKER_IMAGE: ${{ env.REGISTRY }}/omnarr-worker@${{ needs.build.outputs.omnarr-worker }}
          E2E_TO_WEB_IMAGE: ${{ env.REGISTRY }}/omnarr-web@${{ needs.build.outputs.omnarr-web }}
        run: node e2e/run.ts stackUpgrade

  release:
    name: Pin and release
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the images were built from, not main's newest: the release
          # pins what it built and tested.
          ref: ${{ github.sha }}
          # The previous release's tag, for the notes' changed pins.
          fetch-depth: 0
          # Pushes go out with the deploy key (see the top).
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images
        env:
          BACKEND: ${{ needs.build.outputs.omnarr-backend }}
          WORKER: ${{ needs.build.outputs.omnarr-worker }}
          WEB: ${{ needs.build.outputs.omnarr-web }}
        run: |
          docker buildx imagetools create -t "$REGISTRY/omnarr-backend:$VERSION" "$REGISTRY/omnarr-backend@$BACKEND"
          docker buildx imagetools create -t "$REGISTRY/omnarr-worker:$VERSION" "$REGISTRY/omnarr-worker@$WORKER"
          docker buildx imagetools create -t "$REGISTRY/omnarr-web:$VERSION" "$REGISTRY/omnarr-web@$WEB"
          printf '{"omnarr-backend":"%s","omnarr-worker":"%s","omnarr-web":"%s"}\n' "$BACKEND" "$WORKER" "$WEB" > "$RUNNER_TEMP/digests.json"
      - name: Pin compose.yml and compose.vpn.merged.yml
        run: |
          node scripts/pin-images.ts --version "$VERSION" --digests "$RUNNER_TEMP/digests.json"
          node scripts/merge-vpn-compose.ts
          node scripts/check-ports.ts
      # One atomic push: main, release and the tag move together or not at all.
      # It fails if main moved since the release started (a merge meanwhile);
      # start a new run then. A re-run whose tag is already on origin
      # releases that tag's commit instead of making a second one.
      - name: Commit and tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already on origin: releasing its commit."
            git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            git switch --detach --discard-changes "v$VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          # A pre-release leaves `release` at the newest release.
          refs=(HEAD:refs/heads/main "refs/tags/v$VERSION")
          case "$VERSION" in *-*) ;; *) refs+=(HEAD:refs/heads/release) ;; esac
          if ! git push --atomic origin "${refs[@]}"; then
            echo "The push was refused: main moved since this release started, or the deploy key can't pass the rulesets. Nothing was pushed. Start a new run of the workflow (gh workflow run release.yml); re-running this one would build on the same old commit and be refused again."
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER: ${{ needs.build.outputs.omnarr-worker }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # The newest GitHub release before this one: releases before the
          # release commit reached main have their commit off main, so git
          # describe from HEAD wouldn't find them.
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | grep -Fvx "v$VERSION" | head -n 1 || true)
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # A raised Jellyfin major version can't be rolled back: the notes open by asking for its config backup.
          major() { grep -o 'jellyfin/jellyfin:[0-9]*' | head -n 1 | cut -d: -f2; }
          if [ -n "$previous" ] && [ "$(git show "$previous:compose.yml" | major)" != "$(major < compose.yml)" ]; then
            echo "**This release raises Jellyfin's major version. Back up the Jellyfin config volume before you upgrade** (docs/install.md, Backups)." >> "$notes"
            echo >> "$notes"
          fi
          # Every pin that changed since the previous release.
          echo "Pins:" >> "$notes"
          git diff --unified=0 "${previous:-HEAD~1}" -- compose.yml compose.vpn.yml | grep '^+ *image:' | sed 's/^+ *image: */- /' | sort -u >> "$notes"
          # The worker's ffmpeg configure line and Debian package versions, for the source offer.
          image="$REGISTRY/omnarr-worker@$WORKER"
          { echo; echo "ffmpeg in the worker image:"; echo '```'; docker run --rm --entrypoint cat "$image" /licenses/ffmpeg-configure.txt; echo '```'
            echo; echo "<details><summary>The worker image's Debian packages</summary>"; echo; echo '```'
            docker run --rm --entrypoint cat "$image" /licenses/packages.txt; echo '```'; echo "</details>"; } >> "$notes"
          gh release create "v$VERSION" compose.yml compose.vpn.yml compose.vpn.merged.yml .env.example $prerelease --title "omnarr $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
