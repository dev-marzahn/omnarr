name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    name: Build, check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # convex-release verify compares the migrations with the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The worker's real-tool tests: ffmpeg, ffprobe, unar, lsar.
      - name: Install ffmpeg and unar
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg unar
      - run: bun run ready
      - name: Verify the migrations against the base branch
        if: github.event_name == 'pull_request'
        working-directory: packages/backend
        run: bunx convex-release verify

  ports:
    name: No client WebUI port published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node scripts/check-ports.ts

  # apps/worker's tests inside the worker image, on Debian's ffmpeg 7.1 and unar,
  # where the real-tool tests are required (the Dockerfile's `test` stage).
  worker-image:
    name: Worker image and its tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f apps/worker/Dockerfile -t omnarr-worker:ci .
      - run: docker build -f apps/worker/Dockerfile --target test -t omnarr-worker-test:ci .
      - run: docker run --rm omnarr-worker-test:ci
      # The other two images; the backend's without the TMDB secret.
      - run: docker build -f packages/backend/Dockerfile -t omnarr-backend:ci .
      - run: docker build -f apps/web/Dockerfile -t omnarr-web:ci .

  smoke:
    name: Deploy and worker handshake
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke

  e2e:
    name: End-to-end (${{ matrix.scenario }})
    needs: ready
    runs-on: ubuntu-latest
    # The slowest scenario, vpn, takes about 6 minutes locally: gluetun's health check, whose periods are
    # constants, sees the WireGuard outage only after about 2 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # vpn runs gluetun and a WireGuard server, which need /dev/net/tun and NET_ADMIN: the hosted
        # runner is a VM whose Docker gives both; if a run shows otherwise, it moves to a
        # self-hosted runner.
        # Every scenario runs on the root compose files; `install` checks the install and first run.
        scenario: [install, pipeline, jellyfin, torrents, vpn, upgrade, playback, scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node e2e/run.ts ${{ matrix.scenario }}
      # A failed scenario leaves its stack's evidence, secrets scrubbed (e2e/dump.ts).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.scenario }}-failure
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
