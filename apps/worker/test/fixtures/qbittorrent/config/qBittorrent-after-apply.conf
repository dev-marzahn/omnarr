[BitTorrent]
Session\DefaultSavePath=/data/downloads/torrents
Session\DisableAutoTMMByDefault=false
Session\IgnoreSlowTorrentsForQueueing=true
Session\Interface=
Session\MaxActiveDownloads=3
Session\MaxActiveTorrents=5
Session\MaxActiveUploads=3
Session\Port=6881
Session\QueueingSystemEnabled=false
Session\SSL\Port=11461
Session\Tags=omnarr-g-checking, omnarr-g-checkingdl, omnarr-g-error, omnarr-g-goal, omnarr-g-goal-notracker, omnarr-g-goal-tracker, omnarr-g-goal2, omnarr-g-hybrid, omnarr-g-meta, omnarr-g-metav2, omnarr-g-missing, omnarr-g-multi, omnarr-g-other, omnarr-g-pausedparam, omnarr-g-poke, omnarr-g-private, omnarr-g-second, omnarr-g-slow, omnarr-g-stall, omnarr-g-stall2, omnarr-g-stoppedparam, omnarr-g-upload, omnarr-g-v1single, omnarr-g-v2
Session\TorrentContentLayout=Subfolder

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=12

[Network]
Cookies=@Invalid()
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

[Preferences]
Connection\ResolvePeerCountries=true

[WebUI]
AuthSubnetWhitelistEnabled=false
LocalHostAuth=true
Password_PBKDF2="@ByteArray(<salt written by qBittorrent>:<key written by qBittorrent>)"
Port=8080
Username=omnarr
